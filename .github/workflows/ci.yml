name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Typecheck plus the deterministic tests: corpus provenance, golden-set integrity and the
      # grading logic behind every scorer. The model-backed eval runs locally (see README).
      - run: bun run check
